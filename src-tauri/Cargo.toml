[package]
name = "hostess"
version = "0.7.0"
edition = "2021"

[lib]
name = "hostess"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# Auto-Update vom eigenen Server, mit Signaturprüfung.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
ssh2-config = "0.9"
# Gespeicherte Passphrasen und Passwörter: Windows-Anmeldeinformationsverwaltung.
keyring = { version = "3", features = ["windows-native"] }
# Schon im Baum (über tauri): kodiert das Bild aus der Zwischenablage.
png = "0.18"
# Spracheingabe: Whisper läuft auf dem eigenen Rechner (nur CPU), ureq lädt das Modell.
whisper-rs = { version = "0.16", features = ["vulkan", "raw-api"] }
ureq = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "process", "rt"] }
rand = { version = "0.10", features = ["thread_rng"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
